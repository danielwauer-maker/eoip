[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eoip"
version = "0.1.0"
description = "Enterprise Operational Intelligence Platform — reproducible synthetic ERP data generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Faker>=30,<40",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[project.scripts]
eoip = "eoip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
